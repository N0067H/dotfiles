$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true

    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 3, easeOut
}

# Ayu Night wallpaper
background {
    monitor =
    path = ~/dev/dotfiles/hypr/wallpapers/ayu-night.png

    blur_size = 5
    blur_passes = 2

    brightness = 0.72
    contrast = 0.95
    vibrancy = 0.12
    noise = 0.005
}

# Time
label {
    monitor =

    text = $TIME
    color = rgba(cbccc6ff)

    font_size = 110
    font_family = $font

    position = 0, 210
    halign = center
    valign = center
}

# Date
label {
    monitor =

    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(707a8cff)

    font_size = 20
    font_family = $font

    position = 0, 125
    halign = center
    valign = center
}

# Password
input-field {
    monitor =

    size = 360, 56
    outline_thickness = 2

    inner_color = rgba(1f2430cc)
    outer_color = rgba(ffcc66ff) rgba(73d0ffff) 45deg
    check_color = rgba(bae67eff)
    fail_color = rgba(f28779ff)

    font_color = rgba(cbccc6ff)
    font_family = $font

    rounding = 18

    dots_size = 0.20
    dots_spacing = 0.25
    dots_center = true

    fade_on_empty = false

    placeholder_text = <span foreground="##707A8C">Password</span>
    fail_text = <span foreground="##F28779">$PAMFAIL</span>

    position = 0, -20
    halign = center
    valign = center
}
