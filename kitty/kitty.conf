# ── Cursor ──────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.5
cursor_stop_blinking_after 15

# Cursor trail
cursor_trail 3
cursor_trail_decay 0.1 0.25
cursor_trail_start_threshold 2


# ── Scrollback ──────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Shell integration (prompt move)
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1

# Display last command output
map ctrl+shift+g show_last_command_output

# Scrollback search
map ctrl+shift+/ search_scrollback


# ── Shell integration ───────────────────────────────────
shell_integration enabled

# ── Font ──────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        11.0

# ── Ayu Mirage ────────────────────────
background       #1F2430
foreground       #CBCCC6

selection_background #33415E
selection_foreground #CBCCC6

cursor            #FFCC66
cursor_text_color #1F2430

# black
color0  #191E2A
color8  #686868

# red
color1  #ED8274
color9  #F28779

# green
color2  #A6CC70
color10 #BAE67E

# yellow
color3  #F0C36A
color11 #FFCC66

# blue
color4  #6DCAFA
color12 #73D0FF

# magenta
color5  #CFB9F4
color13 #D4BFFF

# cyan
color6  #90E1C6
color14 #95E6CB

# white
color7  #C7C7C7
color15 #FFFFFF

# ── UI ────────────────────────────────
window_padding_width 10

background_opacity 1.0

enable_audio_bell no
visual_bell_duration 0.0

# URL
url_color #73D0FF

# Tab bar (for kitty tab)
# ── Tabs ────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style slant
tab_bar_margin_width 8
tab_bar_margin_height 6 0

tab_title_template "{index}: {title}"
active_tab_title_template "󰆍 {index}: {title}"

active_tab_background #FFCC66
active_tab_foreground #1F2430
active_tab_font_style bold

inactive_tab_background #242936
inactive_tab_foreground #707A8C
inactive_tab_font_style normal

tab_bar_background #1F2430

# ============================================================
# Splits / Windows
# ============================================================

# Open/Close tab
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_window

# Split current tab
map ctrl+shift+backslash launch --location=vsplit
map ctrl+shift+minus launch --location=hsplit

# Move focus between splits
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# Resize current split
map ctrl+shift+left  resize_window narrower 3
map ctrl+shift+right resize_window wider 3
map ctrl+shift+up    resize_window taller 3
map ctrl+shift+down  resize_window shorter 3

# Move current split around
map ctrl+shift+alt+h move_window left
map ctrl+shift+alt+j move_window down
map ctrl+shift+alt+k move_window up
map ctrl+shift+alt+l move_window right

# Cycle layouts
map ctrl+shift+space next_layout

# ====================================
# Utils
# ====================================

# URL hints
map ctrl+shift+o kitten hints --type url
map ctrl+shift+y kitten hints --type url --program @


